name: Publish Docker Image

on:
    workflow_dispatch:
        inputs:
            tag:
                description: "Image version tag (e.g. 2.0.1, or leave empty for latest only)"
                required: false
                default: "2.0.1"
                type: string
            push_latest:
                description: "Also tag and push as latest"
                required: false
                default: true
                type: boolean
    push:
        tags:
            - "v*"

permissions:
    contents: read

env:
    REGISTRY_USER: judempoyo
    IMAGE_NAME: lara-api-starter

jobs:
    publish:
        name: Build and Push
        runs-on: ubuntu-latest
        environment:
            name: docker-publish

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Login to Docker Hub
              uses: docker/login-action@v3
              with:
                  username: ${{ vars.REGISTRY_USER || secrets.DOCKERHUB_USERNAME || env.REGISTRY_USER }}
                  password: ${{ secrets.DOCKERHUB_TOKEN }}

            - name: Generate image metadata
              id: meta
              uses: docker/metadata-action@v5
              with:
                  images: ${{ vars.REGISTRY_USER || env.REGISTRY_USER }}/${{ env.IMAGE_NAME }}
                  flavor: |
                      latest=false
                  tags: |
                      type=raw,value=${{ inputs.tag }},enable=${{ github.event_name == 'workflow_dispatch' && inputs.tag != '' && inputs.tag != 'latest' }}
                      type=semver,pattern={{version}},enable=${{ github.event_name == 'push' }}
                      type=sha,format=short,prefix=sha-
                      type=raw,value=latest,enable=${{ (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'workflow_dispatch' && (inputs.push_latest == true || inputs.tag == 'latest' || inputs.tag == '')) }}

            - name: Build and push
              uses: docker/build-push-action@v6
              with:
                  context: .
                  push: true
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}
                  build-args: |
                      VERSION=${{ inputs.tag != '' && inputs.tag || steps.meta.outputs.version || '2.0.1' }}
                      VCS_REF=${{ github.sha }}
                      BUILD_DATE=${{ fromJSON(steps.meta.outputs.json).created }}
                  cache-from: type=gha
                  cache-to: type=gha,mode=max

            - name: Update Docker Hub description
              uses: peter-evans/dockerhub-description@v4
              continue-on-error: true
              with:
                  username: ${{ vars.REGISTRY_USER || secrets.DOCKERHUB_USERNAME || env.REGISTRY_USER }}
                  password: ${{ secrets.DOCKERHUB_TOKEN }}
                  repository: ${{ vars.REGISTRY_USER || env.REGISTRY_USER }}/${{ env.IMAGE_NAME }}
                  readme-filepath: ./README.md
                  short-description: "Laravel API starter with Action-DTO architecture and Sanctum authentication"
