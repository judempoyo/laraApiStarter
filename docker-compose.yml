services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lara_api_starter_app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8000}:80"
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: "http://localhost:${APP_PORT:-8000}"
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-lara_api_db}
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MAIL_MAILER: smtp
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      QUEUE_CONNECTION: database
      CACHE_STORE: redis
      SESSION_DRIVER: redis
    volumes:
      - .:/var/www/html
      - /var/www/html/vendor
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      mailpit:
        condition: service_started
    networks:
      - lara_network

  postgres:
    image: postgres:17-alpine
    container_name: lara_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-lara_api_db}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    ports:
      - "${FORWARD_DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_DATABASE:-lara_api_db}",
        ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - lara_network

  redis:
    image: redis:alpine
    container_name: lara_redis
    restart: unless-stopped
    ports:
      - "${FORWARD_REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - lara_network

  mailpit:
    image: axllent/mailpit:latest
    container_name: lara_mailpit
    restart: unless-stopped
    ports:
      - "${FORWARD_MAIL_SMTP_PORT:-1025}:1025"
      - "${FORWARD_MAIL_WEB_PORT:-8025}:8025"
    networks:
      - lara_network

networks:
  lara_network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
